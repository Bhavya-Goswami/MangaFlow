        const incoming = data.results || [];
        if (append) {
          const seen = new Set(state.results.map((item) => `${item.source}:${item.id}`));
          state.results = [...state.results, ...incoming.filter((item) => !seen.has(`${item.source}:${item.id}`))];
          state.searchPage = page;
        } else {
          state.results = incoming;
          state.searchPage = page;
        }
        state.searchExhausted = incoming.length === 0;
        renderResults();
        if (!append) {
          saveRecent(query);
          if (!options.fromRoute) setHash(`#/search/${encodeURIComponent(query)}`);
        }
        const sourceErrors = data.errors && data.errors.length ? ` · Unavailable: ${data.errors.map((item) => item.source.replace(/^parser:/, "")).join(", ")}` : "";
        const cached = data.cached ? " (cached)" : "";
        const matches = filteredResults().length;
        setStatus(`${matches} titles found${cached}${sourceErrors}`, matches ? "good" : (data.errors?.length ? "error" : ""));
      } catch (err) {
        if (!append) {
          state.results = [];
          els.results.innerHTML = "";
          els.results.appendChild(renderEmpty(err.message, false, () => runSearch(query, options), err.details || ""));
        }
        toast(err.message, "error");
        setStatus(err.message, "error");
      } finally {
        setLoading(false);
      }
    }

    function renderResults() {
      els.results.innerHTML = "";
      const visibleResults = filteredResults();
      if (!visibleResults.length) {
        els.results.appendChild(renderEmpty("No manga found. Try searching another query.", true));
        return;
      }
      for (const item of visibleResults) {
        const button = document.createElement("button");
        button.className = "card";
        button.type = "button";

        const posterWrap = document.createElement("div");
        posterWrap.className = "poster-wrap";
        posterWrap.appendChild(poster(item.cover, item.title));

        const gradient = document.createElement("div");
        gradient.className = "poster-gradient";
        posterWrap.appendChild(gradient);

        const body = document.createElement("div");
        body.className = "card-body";
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = item.title;
        const source = document.createElement("div");
        source.className = "source";
        const sourceLabel = document.createElement("span");
        sourceLabel.textContent = item.sourceName || item.source;
        source.appendChild(sourceLabel);
        if (isPreferred(item)) {
          const verified = document.createElement("b");
          verified.textContent = "VERIFIED";
          source.appendChild(verified);
        }

        body.append(title, source);
        button.append(posterWrap, body);
        button.addEventListener("click", () => loadManga(item));
        els.results.appendChild(button);
      }

      if (state.query && !state.searchExhausted && state.searchPage < 20) {
        const wrap = document.createElement("div");
        wrap.className = "load-more-wrap";
        const more = document.createElement("button");
        more.type = "button";
        more.textContent = "Load More";
        more.addEventListener("click", () => runSearch(state.query, { append: true, page: state.searchPage + 1 }));
        const refresh = document.createElement("button");
        refresh.type = "button";
        refresh.textContent = "Refresh Results";
        refresh.title = "Bypass the cache and search again";
        refresh.addEventListener("click", () => runSearch(state.query, { refresh: true }));
        wrap.append(more, refresh);
        els.results.appendChild(wrap);
      }
    }

    function filteredResults() {
      const kind = els.typeFilter.value;
      if (kind === "all") return state.results;
      return state.results.filter((item) => {
        const type = String(item.type || inferTitleType(item)).toLowerCase();
        return type.includes(kind);
      });
    }

    function inferTitleType(item) {
      const source = `${item.source || ""} ${item.sourceName || ""}`.toLowerCase();
      if (/asura|flamecomics|webtoon/.test(source)) return "manhwa";
      if (/mangaplus/.test(source)) return "manga";
      return "unknown";
    }

    function isPreferred(item) {
      return /asura|flame|aqua|comick/i.test(item.sourceName || item.source);
    }

    async function loadManga(item, options = {}) {
      show("details");
      els.details.innerHTML = "";
      els.details.appendChild(renderEmpty("Loading manga catalog details..."));
      setLoading(true, "Loading manga details...");
      try {
        const refresh = options.refresh ? "&refresh=1" : "";
        const url = `/api/manga?source=${encodeURIComponent(item.source)}&id=${encodeURIComponent(item.id)}${refresh}`;
        const data = await getJSON(url);
        state.manga = { ...item, ...data };
        state.chapters = data.chapters || [];
        state.filteredChapters = [...state.chapters];
        if (isFavorite(state.manga)) {
          const favorite = state.favorites.find((entry) => favoriteKey(entry) === favoriteKey(state.manga));
          if (favorite) {
            favorite.chapterCount = state.chapters.length;
            favorite.latestLabel = state.chapters.length ? state.chapters[state.chapters.length - 1].label : "";
            favorite.newCount = 0;
            favorite.cover = state.manga.cover || favorite.cover;
            localStorage.setItem("mangaflow:favorites", JSON.stringify(state.favorites));
          }
        }
        renderManga();
        refreshDownloadsSilent();
        const suffix = data.errors && data.errors.length ? `, ${data.errors.length} source errors` : "";
        setStatus(`${state.chapters.length} chapters loaded${suffix}`, state.chapters.length ? "good" : "");
        let openedChapter = false;
        if (options.openChapterId) {
          const index = state.chapters.findIndex((chapter) => (chapter.id === options.openChapterId && (!options.openChapterSource || chapter.source === options.openChapterSource)) || chapter.choices?.some((choice) => choice.id === options.openChapterId && (!options.openChapterSource || choice.source === options.openChapterSource)));
          if (index >= 0) {
            const choice = state.chapters[index].choices?.find((item) => item.id === options.openChapterId && (!options.openChapterSource || item.source === options.openChapterSource));
            openedChapter = true;
            // loadChapter refuses to run while state.loading is true; defer past this function's finally.
            setTimeout(() => loadChapter(index, choice || null, options.page, { fromRoute: options.fromRoute }), 0);
          }
        }
        if (!options.fromRoute && !openedChapter) setHash(titleHash(state.manga));
      } catch (err) {
        els.details.innerHTML = "";
        els.details.appendChild(renderEmpty(err.message, false, () => loadManga(item, options), err.details || ""));
        setStatus(err.message, "error");
      } finally {
        setLoading(false);
      }
    }

    async function refreshDownloadsSilent() {
      try {
        const data = await getJSON("/api/downloads");
        state.downloads = data.downloads || [];
        if (state.view === "details") renderChapterList();
      } catch {
        /* download state is best-effort outside the library */
      }
    }

    function findDownloadFor(chapter) {
      const ids = new Set([chapter.id, ...(chapter.choices || []).map((choice) => choice.id)]);
      return state.downloads.find((job) => ids.has(job.chapterId) && (!state.manga?.id || !job.mangaId || job.mangaId === state.manga.id));
    }

    function renderManga() {
      const manga = state.manga;
      els.details.innerHTML = "";

      const coverWrap = document.createElement("aside");
      coverWrap.className = "cover-wrap";
      coverWrap.appendChild(poster(manga.cover, manga.title, "cover"));

      const panel = document.createElement("section");
      panel.className = "detail-panel";

      const backRow = document.createElement("div");
      backRow.className = "back-row";
      const back = document.createElement("button");
      back.className = "btn-back";
      back.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      `;
      back.appendChild(document.createTextNode("Back to Results"));
      back.addEventListener("click", () => {
        navigate(state.query ? `#/search/${encodeURIComponent(state.query)}` : "#/");
      });
      backRow.appendChild(back);

      const title = document.createElement("h1");
      title.textContent = manga.title || "Untitled";

      const subline = document.createElement("div");
      subline.className = "subline";
      subline.append(
        badge(manga.sourceName || manga.source, "badge-accent"),
        badge(`${state.chapters.length} Chapters`)
      );

      const description = document.createElement("p");
      description.className = "description";
      const synopsis = manga.description || "No synopsis available for this title.";
      const descriptionParts = [description];
      const CLAMP = 600;
      if (synopsis.length > CLAMP) {
        description.textContent = `${synopsis.slice(0, CLAMP).trimEnd()}…`;
        const more = document.createElement("button");
        more.type = "button";
        more.className = "description-more";
        more.textContent = "Show full synopsis";
        more.setAttribute("aria-expanded", "false");
        more.addEventListener("click", () => {
          const expanded = more.getAttribute("aria-expanded") === "true";
          description.textContent = expanded ? `${synopsis.slice(0, CLAMP).trimEnd()}…` : synopsis;
          more.textContent = expanded ? "Show full synopsis" : "Show less";
          more.setAttribute("aria-expanded", String(!expanded));
        });
        descriptionParts.push(more);
      } else {
        description.textContent = synopsis;
      }
      document.title = `${manga.title || "Untitled"} — MangaFlow`;

      const historyEntry = state.history[historyKey(manga)];
      const readSet = readSetFor(manga);
      const resumeIndex = historyEntry?.chapter
        ? state.chapters.findIndex((chapter) => String(chapter.label) === String(historyEntry.chapter.label))
        : -1;

      const actions = document.createElement("div");
      actions.className = "actions";
      const first = document.createElement("button");
      first.className = "primary";
      first.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      `;
      if (resumeIndex >= 0) {
        first.appendChild(document.createTextNode(`Resume CH. ${state.chapters[resumeIndex].label}`));
        first.addEventListener("click", () => loadChapter(resumeIndex, null, historyEntry.page));
      } else {
        first.appendChild(document.createTextNode("Read Chapter 1"));
        first.addEventListener("click", () => loadChapter(0));
      }
      first.disabled = !state.chapters.length;

      const latest = document.createElement("button");
      latest.textContent = "Latest Chapter";
      latest.disabled = !state.chapters.length;
      latest.addEventListener("click", () => loadChapter(state.chapters.length - 1));

      const favorite = document.createElement("button");
      favorite.className = `favorite-toggle${isFavorite(manga) ? " active" : ""}`;
      favorite.type = "button";
      favorite.textContent = isFavorite(manga) ? "Saved" : "Add to Favorites";
      favorite.setAttribute("aria-pressed", String(isFavorite(manga)));
      favorite.addEventListener("click", () => toggleFavorite(manga));

      const refresh = document.createElement("button");
      refresh.textContent = "Refresh";
      refresh.title = "Re-fetch chapters from the sources";
      refresh.addEventListener("click", () => loadManga(manga, { refresh: true }));

      actions.append(first, latest, favorite, refresh);

      // Chapter Section
      const chapterSec = document.createElement("div");
      chapterSec.className = "chapter-section";

      const chHeader = document.createElement("div");
      chHeader.className = "chapter-header";
      const chHeading = document.createElement("h3");
      chHeading.textContent = "Available Chapters";
      const headerTools = document.createElement("div");
      headerTools.className = "chapter-header-tools";
      if (readSet.size) headerTools.appendChild(badge(`${readSet.size} read`));
      const downloadUnread = document.createElement("button");
      downloadUnread.type = "button";
      downloadUnread.textContent = "Download Unread";
      downloadUnread.title = "Queue every chapter you have not read yet for offline reading";
      downloadUnread.disabled = !state.chapters.length;
      downloadUnread.addEventListener("click", () => {
        const unread = state.chapters.filter((chapter) => !readSet.has(String(chapter.label)));
        bulkDownload(unread.length ? unread : state.chapters);
      });
      const downloadAll = document.createElement("button");
      downloadAll.type = "button";
      downloadAll.textContent = "Download All";
      downloadAll.disabled = !state.chapters.length;
      downloadAll.addEventListener("click", () => bulkDownload(state.chapters));
      const downloadBatch = document.createElement("button");
      downloadBatch.type = "button";
      downloadBatch.className = "primary";
      downloadBatch.textContent = "Download…";
      downloadBatch.title = "Choose exactly how many chapters to queue for offline reading";
      downloadBatch.disabled = !state.chapters.length;
      downloadBatch.addEventListener("click", () => openBatchDialog());
      headerTools.append(downloadUnread, downloadAll, downloadBatch);
      chHeader.append(chHeading, headerTools);

      const tools = document.createElement("div");
      tools.className = "chapter-tools";
      const filter = document.createElement("input");
      filter.className = "filter";
      filter.placeholder = "FILTER CHAPTER NO. OR TITLE...";
      filter.addEventListener("input", () => filterChapters(filter.value));

      const reverse = document.createElement("button");
      const reverseLabel = () => {
        reverse.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/>
          </svg>
        `;
        reverse.appendChild(document.createTextNode(state.reverse ? "Oldest First" : "Latest First"));
      };
      reverseLabel();
      reverse.addEventListener("click", () => {
        state.reverse = !state.reverse;
        reverseLabel();
        renderChapterList();
      });
      tools.append(filter, reverse);

      const list = document.createElement("div");
      list.className = "chapters";
      list.id = "chapterList";

      chapterSec.append(chHeader, tools, list);
      panel.append(backRow, title, subline, ...descriptionParts, actions, chapterSec);
      els.details.append(coverWrap, panel);
      renderChapterList();
    }

    function badge(text, customClass = "") {
      const item = document.createElement("span");
      item.className = `badge ${customClass}`.trim();
      item.textContent = text;
      return item;
    }

    function filterChapters(value) {
      const needle = value.trim().toLowerCase();
      state.filteredChapters = state.chapters.filter((chapter) => {
        return !needle || String(chapter.label).includes(needle) || String(chapter.title || "").toLowerCase().includes(needle);
      });
      renderChapterList();
    }

    function renderChapterList() {
      const list = document.querySelector("#chapterList");
      if (!list) return;
      list.innerHTML = "";
      const chapters = [...state.filteredChapters];
      if (state.reverse) chapters.reverse();
      if (!chapters.length) {
        list.appendChild(renderEmpty("No matching chapters found."));
        return;
      }
      const readSet = state.manga ? readSetFor(state.manga) : new Set();
      const currentLabel = state.history[state.manga ? historyKey(state.manga) : ""]?.chapter?.label;
      for (const chapter of chapters) {
        const realIndex = state.chapters.indexOf(chapter);
        const entry = document.createElement("div");
        entry.className = "chapter-entry";
        if (readSet.has(String(chapter.label))) entry.classList.add("read");
        if (currentLabel !== undefined && String(currentLabel) === String(chapter.label)) entry.classList.add("current");
        const button = document.createElement("button");
        button.className = "chapter";
        button.type = "button";
        const choices = chapter.choices && chapter.choices.length > 1 ? ` · ${chapter.choices.length} SRC` : "";
        const strong = document.createElement("strong");
        strong.textContent = `CH. ${chapter.label}`;
        const span = document.createElement("span");
        span.textContent = `${chapter.sourceName || chapter.source}${choices}`;
        button.append(strong, span);
        button.title = chapter.title || `Chapter ${chapter.label}`;
        button.addEventListener("click", () => loadChapter(realIndex, getChapterChoice(entry, chapter)));

        if (chapter.choices?.length > 1) {
          const select = document.createElement("select");
          select.className = "chapter-choice";
          select.setAttribute("aria-label", `Source for chapter ${chapter.label}`);
          chapter.choices.forEach((choice, index) => {
            const option = document.createElement("option");
            option.value = String(index);
            option.textContent = choice.sourceName || choice.source;
            select.appendChild(option);
          });
          select.value = String(Math.max(0, chapter.choices.findIndex((choice) => choice.source === chapter.source && choice.id === chapter.id)));
          entry.appendChild(select);
        }

        const download = document.createElement("button");
        download.className = "chapter-download";
        download.type = "button";
        const job = findDownloadFor(chapter);
        if (job && job.status === "completed") {
          download.classList.add("saved");
          download.title = `Chapter ${chapter.label} is saved offline — click to read`;
          download.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
          download.addEventListener("click", () => openOfflineChapter(job.id));
        } else if (job && (job.status === "queued" || job.status === "downloading")) {
          download.disabled = true;
          download.title = `Downloading chapter ${chapter.label} (${job.downloadedPages || 0}/${job.total || "…"} pages)`;
          download.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/></svg>`;
        } else {
          download.title = `Download Chapter ${chapter.label} for offline reading`;
          download.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>`;
          download.addEventListener("click", () => downloadChapter(chapter, download, getChapterChoice(entry, chapter)));
        }
        download.setAttribute("aria-label", download.title);

        entry.prepend(button);
        const sourceSelect = entry.querySelector(".chapter-choice");
        if (sourceSelect) entry.insertBefore(download, sourceSelect);
        else entry.append(download);
        list.appendChild(entry);
      }
    }

    function getChapterChoice(entry, chapter) {
      const select = entry.querySelector(".chapter-choice");
      return select ? chapter.choices[Number(select.value)] : null;
    }

    async function loadChapter(index, selectedChoice = null, resumePage = null, options = {}) {
      const chapter = state.chapters[index];
      if (!chapter || state.loading) return;
      const movingForward = state.chapterIndex >= 0 && index > state.chapterIndex && state.readerChapter;
      if (movingForward) markChapterRead(state.readerChapter.label);
      const choice = selectedChoice || null;
      const chapterSource = choice?.source || chapter.source;
      const chapterId = choice?.id || chapter.id;
      state.chapterIndex = index;
      state.offlineReader = false;
      state.currentChoice = choice;
      show("reader");
      els.reader.innerHTML = "";
      els.reader.appendChild(renderEmpty("Fetching pages..."));
      setLoading(true, `LOADING CH. ${chapter.label}...`);
      try {
        const url = `/api/chapter?source=${encodeURIComponent(chapterSource)}&id=${encodeURIComponent(chapterId)}`;
        const data = await getJSON(url);
        state.lastRead = {
          manga: {
            id: state.manga.id,
            source: state.manga.source,
            sourceName: state.manga.sourceName,
            title: state.manga.title,
            cover: state.manga.cover,
            url: state.manga.url
          },
          chapter: { id: data.id || chapterId, source: data.source || chapterSource, label: chapter.label, number: chapter.number, page: Number(resumePage || 1), pages: (data.pages || []).length }
        };
        localStorage.setItem("mangaflow:lastRead", JSON.stringify(state.lastRead));
        recordProgress(Number(resumePage || 1));
        renderReader(chapter, data.pages || [], Number(resumePage || 1));
        if (!options.fromRoute) setHash(currentReadHash());
        const fallback = data.source !== chapter.source ? ` via ${data.sourceName || data.source}` : "";
        setStatus(`${(data.pages || []).length} pages loaded${fallback}`, "good");
      } catch (err) {
        els.reader.innerHTML = "";
        els.reader.append(readerBar(chapter), renderEmpty(`${err.message} Try another source from the chapter list, or retry.`, false, () => loadChapter(index, selectedChoice, resumePage, options), err.details || ""));
        setStatus(err.message, "error");
      } finally {
        setLoading(false);
      }
    }

    async function downloadChapter(chapter, button, selectedChoice = null) {
      if (!chapter) return;
      const choice = selectedChoice || chapter;
      if (button) button.disabled = true;
      setStatus(`PREPARING CH. ${chapter.label} DOWNLOAD...`, "good");
      try {
        const response = await fetch("/api/downloads", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source: choice.source,
            id: choice.id,
            label: chapter.label,
            title: chapter.title,
            mangaTitle: state.manga?.title || "",
            mangaId: state.manga?.id || "",
            mangaSource: state.manga?.source || ""
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || "Could not start chapter download.");
        show("library");
        selectLibraryTab("downloads");
        refreshLibrary();
      } catch (err) {
        setStatus(err.message, "error");
        toast(err.message, "error");
      } finally {
        if (button) button.disabled = false;
      }
    }

    async function bulkDownload(chapters) {
      if (!chapters.length) return;
      const ok = await confirmDialog({
        title: "Download chapters?",
        body: `Queue ${chapters.length} chapter${chapters.length === 1 ? "" : "s"} for offline reading. Downloads run in the background and use disk space.`,
        confirmLabel: `Download ${chapters.length}`
      });
      if (!ok) return;
      await queueChapters(chapters);
    }

    async function queueChapters(chapters) {
      if (!chapters.length) { toast("No chapters to queue."); return; }
      setLoading(true, `QUEUEING ${chapters.length} DOWNLOADS...`);
      try {
        const response = await fetch("/api/downloads/batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chapters: chapters.map((chapter) => {
              const choice = chapter.choices?.[0] || chapter;
              return { source: choice.source, id: choice.id, label: chapter.label, title: chapter.title };
            }),
            mangaTitle: state.manga?.title || "",
            mangaId: state.manga?.id || "",
            mangaSource: state.manga?.source || ""
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || "Could not queue downloads.");
        toast(`${data.queued} download${data.queued === 1 ? "" : "s"} queued${data.skipped ? ` · ${data.skipped} already saved or active` : ""}`);
        show("library");
        selectLibraryTab("downloads");
        refreshLibrary();
      } catch (err) {
        setStatus(err.message, "error");
        toast(err.message, "error");
      } finally {
        setLoading(false);
      }
    }

    function selectBatchChapters(mode, count) {
      let list = [...state.chapters];
      if (mode === "unread") {
        const read = state.manga ? readSetFor(state.manga) : new Set();
        list = list.filter((chapter) => !read.has(String(chapter.label)));
      } else if (mode === "latest") {
        list.reverse();
      }
      return list.slice(0, Math.max(1, count));
    }

    function openBatchDialog() {
      if (!state.chapters.length) return;
      const overlay = document.createElement("div");
      overlay.className = "confirm-overlay";
      const box = document.createElement("div");
      box.className = "confirm-box batch-box";
      const heading = document.createElement("h2");
      heading.textContent = "Batch download";
      const intro = document.createElement("p");
      intro.textContent = "Choose how many chapters to save for offline reading.";
      const modeRow = document.createElement("label");
      modeRow.className = "batch-field";
      const modeLabel = document.createElement("span");
      modeLabel.textContent = "Start from";
      const mode = document.createElement("select");
      mode.className = "filter";
      for (const [value, text] of [["unread", "Next unread"], ["first", "First chapter"], ["latest", "Latest chapter"]]) {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = text;
        mode.appendChild(opt);
      }
      modeRow.append(modeLabel, mode);
      const countRow = document.createElement("label");
      countRow.className = "batch-field";
      const countLabel = document.createElement("span");
      countLabel.textContent = "Number of chapters";
      const count = document.createElement("input");
      count.type = "number";
      count.min = "1";
      count.max = String(state.chapters.length);
      count.value = String(Math.min(10, state.chapters.length));
      count.className = "filter";
      countRow.append(countLabel, count);
      const presets = document.createElement("div");
      presets.className = "batch-presets";
      for (const n of [5, 10, 25, 50, 100]) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = String(n);
        btn.addEventListener("click", () => { count.value = String(Math.min(n, state.chapters.length)); update(); });
        presets.appendChild(btn);
      }
      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "chip";
      allBtn.textContent = "All";
      allBtn.addEventListener("click", () => { count.value = String(state.chapters.length); update(); });
      presets.appendChild(allBtn);
      const preview = document.createElement("div");
      preview.className = "batch-preview";
      const actions = document.createElement("div");
      actions.className = "confirm-actions";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.textContent = "Cancel";
      const confirm = document.createElement("button");
      confirm.type = "button";
      confirm.className = "primary";
      function dismiss() { overlay.remove(); document.removeEventListener("keydown", onKey); }
      function onKey(event) { if (event.key === "Escape") dismiss(); }
      function currentCount() { return Math.max(1, Math.min(state.chapters.length, parseInt(count.value, 10) || 1)); }
      function update() {
        const sel = selectBatchChapters(mode.value, currentCount());
        preview.textContent = sel.length
          ? `Will queue ${sel.length} chapter${sel.length === 1 ? "" : "s"} (CH. ${sel[0].label} → CH. ${sel[sel.length - 1].label}). Already-saved chapters are skipped.`
          : "No chapters match this selection.";
        confirm.textContent = `Queue ${sel.length}`;
        confirm.disabled = !sel.length;
      }
      cancel.addEventListener("click", dismiss);
      confirm.addEventListener("click", () => {
        const sel = selectBatchChapters(mode.value, currentCount());
        dismiss();
        queueChapters(sel);
      });
      mode.addEventListener("change", update);
      count.addEventListener("input", update);
      overlay.addEventListener("click", (event) => { if (event.target === overlay) dismiss(); });
      document.addEventListener("keydown", onKey);
      actions.append(cancel, confirm);
      box.append(heading, intro, modeRow, countRow, presets, preview, actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      update();
      count.focus();
      count.select();
    }

    async function refreshDownloadSettings() {
      try { state.downloadSettings = { ...state.downloadSettings, ...await getJSON("/api/download-settings") }; } catch {}
    }

    async function saveDownloadSetting(key, value) {
      state.downloadSettings = { ...state.downloadSettings, [key]: value };
      try {
        const response = await fetch("/api/download-settings", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(state.downloadSettings)
        });
        if (response.ok) state.downloadSettings = await response.json();
      } catch {}
    }

    function renderDownloadControls() {
      const s = state.downloadSettings;
      const wrap = document.createElement("details");
      wrap.className = "source-report dl-settings";
      const summary = document.createElement("summary");
      summary.textContent = `Download settings · ${s.concurrency} at a time${s.paused ? " · paused" : ""}`;
      wrap.appendChild(summary);
      const grid = document.createElement("div");
      grid.className = "dl-settings-grid";
      const fields = [
        ["concurrency", "Chapters at once", 1, 6, 1],
        ["pageConcurrency", "Pages per chapter", 1, 8, 1],
        ["retries", "Retries per page", 0, 5, 1],
        ["retryDelay", "Retry delay (s)", 0, 10, 0.5],
        ["timeout", "Timeout (s)", 10, 180, 5],
      ];
      for (const [key, label, min, max, step] of fields) {
        const lab = document.createElement("label");
        lab.className = "dl-field";
        const span = document.createElement("span");
        span.textContent = label;
        const input = document.createElement("input");
        input.type = "number";
        input.min = String(min);
        input.max = String(max);
        input.step = String(step);
        input.value = String(s[key]);
        input.addEventListener("change", () => {
          const value = Math.max(min, Math.min(max, parseFloat(input.value) || min));
          input.value = String(value);
          saveDownloadSetting(key, value);
        });
        lab.append(span, input);
        grid.appendChild(lab);
      }
      const skipLab = document.createElement("label");
      skipLab.className = "dl-field dl-check";
      const skip = document.createElement("input");
      skip.type = "checkbox";
      skip.checked = Boolean(s.skipExisting);
      skip.addEventListener("change", () => saveDownloadSetting("skipExisting", skip.checked));
      const skipSpan = document.createElement("span");
      skipSpan.textContent = "Skip already-downloaded chapters";
      skipLab.append(skip, skipSpan);
      grid.appendChild(skipLab);
      wrap.appendChild(grid);
      els.libraryContent.appendChild(wrap);

      const tools = document.createElement("div");
      tools.className = "library-actions dl-tools";
      const pause = document.createElement("button");
      pause.type = "button";
      pause.textContent = s.paused ? "Resume queue" : "Pause queue";
      pause.addEventListener("click", async () => {
        await saveDownloadSetting("paused", !state.downloadSettings.paused);
        renderLibrary();
      });
      const retryFailed = document.createElement("button");
      retryFailed.type = "button";
      retryFailed.textContent = "Retry failed";
      const failed = state.downloads.filter((job) => job.status === "failed");
      retryFailed.disabled = !failed.length;
      retryFailed.addEventListener("click", async () => {
        for (const job of failed) await retryDownload(job);
      });
      tools.append(pause, retryFailed);
      els.libraryContent.appendChild(tools);
    }

    function renderSourceReport(statuses) {
      els.sourceReport.innerHTML = "";
      if (!statuses.length) {
        els.sourceReport.classList.add("hidden");
        delete els.sourceReport.dataset.hasReport;
        return;
      }
      const ok = statuses.filter((item) => item.status === "ok").length;
      const empty = statuses.filter((item) => item.status === "empty").length;
      const failed = statuses.filter((item) => item.status === "error").length;
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = `Sources: ${ok} with results · ${empty} empty${failed ? ` · ${failed} failed` : ""}`;
      const list = document.createElement("div");
      list.className = "source-report-list";
      for (const item of statuses) {
        const row = document.createElement("div");
        row.className = `source-report-item ${item.status}`;
        const name = document.createElement("span");
        name.textContent = item.name || item.source.replace(/^parser:/, "");
        const value = document.createElement("span");
        value.textContent = item.status === "error" ? "failed" : `${item.count}`;
        if (item.error) row.title = item.error;
        row.append(name, value);
        list.appendChild(row);
      }
      details.append(summary, list);
      els.sourceReport.appendChild(details);
      els.sourceReport.dataset.hasReport = "1";
      els.sourceReport.classList.toggle("hidden", state.view !== "results");
    }

    function selectLibraryTab(tab, options = {}) {
      state.libraryTab = tab;
      const tabs = { downloads: els.downloadsTab, favorites: els.favoritesTab, history: els.historyTab, sources: els.sourcesTab };
      for (const [name, button] of Object.entries(tabs)) {
        const active = name === tab;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
        button.tabIndex = active ? 0 : -1;
      }
      els.libraryContent.setAttribute("aria-labelledby", tabs[tab].id);
      if (!options.fromRoute) setHash(`#/library/${tab}`, true);
      renderLibrary();
    }

    async function refreshLibrary() {
      try {
        const data = await getJSON("/api/downloads");
        state.downloads = data.downloads || [];
        renderLibrary();
        window.clearTimeout(state.libraryPollTimer);
        if (state.downloads.some((job) => job.status === "queued" || job.status === "downloading")) {
          state.libraryPollTimer = window.setTimeout(refreshLibrary, 700);
        }
      } catch (err) {
        els.libraryContent.replaceChildren(renderEmpty(err.message));
      }
    }

    function formatBytes(bytes) {
      if (!bytes) return "0 MB";
      const mb = bytes / (1024 * 1024);
      return mb >= 1024 ? `${(mb / 1024).toFixed(2)} GB` : `${mb.toFixed(1)} MB`;
    }

    function downloadRow(job) {
      const row = document.createElement("div");
      row.className = "library-row";
      const info = document.createElement("div");
      info.className = "library-info";
      const title = document.createElement("strong");
      title.textContent = `${job.mangaTitle ? `${job.mangaTitle} · ` : ""}CH. ${job.label}`;
      const source = document.createElement("span");
      source.textContent = `${job.sourceName || job.source} · ${job.pageCount || 0} pages${job.bytes ? ` · ${formatBytes(job.bytes)}` : ""}`;
      info.append(title, source);
      const progressWrap = document.createElement("div");
      progressWrap.className = "library-progress-wrap";
      const status = document.createElement("div");
      status.className = "library-state";
      status.textContent = job.status === "downloading" || job.status === "queued"
        ? `${job.status} · ${job.downloadedPages || 0}/${job.total || "…"} pages${job.total ? ` · ${Math.round(((job.progress || 0) / job.total) * 100)}%` : ""}`
        : job.status === "completed" ? "Saved offline"
        : job.status === "cancelled" ? "Cancelled"
        : `Failed · ${job.error || "Download failed"}`;
      progressWrap.appendChild(status);
      if (job.status === "downloading" || job.status === "queued") {
        const progress = document.createElement("progress");
        progress.className = "library-progress";
        progress.max = Math.max(1, job.total || 1);
        progress.value = job.progress || 0;
        progressWrap.appendChild(progress);
      }
      const actions = document.createElement("div");
      actions.className = "library-actions";
      if (job.status === "completed") {
        const open = document.createElement("button");
        open.className = "primary";
        open.textContent = "Read Offline";
        open.addEventListener("click", () => openOfflineChapter(job.id));
        actions.appendChild(open);
        const exportBtn = document.createElement("button");
        exportBtn.textContent = "Export";
        exportBtn.title = "Save a ZIP with the pages and a standalone HTML reader";
        exportBtn.addEventListener("click", () => {
          const a = document.createElement("a");
          a.href = `/api/library/${job.id}/export`;
          a.download = "";
          document.body.appendChild(a);
          a.click();
          a.remove();
          toast("Exporting chapter…");
        });
        actions.appendChild(exportBtn);
      } else if (job.status === "failed" || job.status === "cancelled") {
        const retry = document.createElement("button");
        retry.textContent = "Retry";
        retry.addEventListener("click", () => retryDownload(job));
        actions.appendChild(retry);
      } else if (job.status === "queued" || job.status === "downloading") {
        const cancel = document.createElement("button");
        cancel.textContent = "Cancel";
        cancel.addEventListener("click", () => cancelDownload(job.id));
        actions.appendChild(cancel);
      }
      if (job.status !== "queued" && job.status !== "downloading") {
        const remove = document.createElement("button");
        remove.textContent = "Remove";
        remove.title = "Remove this download and its saved pages";
        remove.addEventListener("click", () => removeDownload(job.id));
        actions.appendChild(remove);
      }
      row.append(info, progressWrap, actions);
      return row;
    }

    function renderLibrary() {
      els.libraryContent.innerHTML = "";
      if (state.libraryTab === "favorites") {
        renderFavoritesTab();
        return;
      }
      if (state.libraryTab === "history") {
        renderHistoryTab();
        return;
      }
      if (state.libraryTab === "sources") {
        renderSourcesTab();
        return;
      }

      renderDownloadControls();
      if (!state.downloads.length) {
        els.libraryContent.appendChild(renderEmpty("Nothing saved offline yet. Open a chapter and press Download to read it here without a connection."));
        return;
      }
      const completed = state.downloads.filter((job) => job.status === "completed");
      const summary = document.createElement("div");
      summary.className = "library-summary";
      const totalPages = completed.reduce((sum, job) => sum + (job.pageCount || 0), 0);
      const totalBytes = completed.reduce((sum, job) => sum + (job.bytes || 0), 0);
      summary.textContent = `${completed.length} chapters · ${totalPages} pages · ${formatBytes(totalBytes)} saved offline`;
      els.libraryContent.appendChild(summary);

      const active = state.downloads.filter((job) => job.status === "queued" || job.status === "downloading");
      const problems = state.downloads.filter((job) => job.status === "failed" || job.status === "cancelled");
      for (const job of [...active, ...problems]) {
        els.libraryContent.appendChild(downloadRow(job));
      }

      const groups = new Map();
      for (const job of completed) {
        const key = job.mangaTitle || "Other chapters";
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(job);
      }
      for (const [mangaTitle, jobs] of groups) {
        jobs.sort((a, b) => (parseFloat(a.label) || 0) - (parseFloat(b.label) || 0));
        const head = document.createElement("div");
        head.className = "library-group-head";
        const name = document.createElement("strong");
        name.textContent = mangaTitle;
        const count = document.createElement("span");
        count.textContent = `${jobs.length} chapter${jobs.length === 1 ? "" : "s"}`;
        head.append(name, count);
        els.libraryContent.appendChild(head);
        for (const job of jobs) els.libraryContent.appendChild(downloadRow(job));
      }
    }

    function renderFavoritesTab() {
      const tools = document.createElement("div");
      tools.className = "library-actions";
      const check = document.createElement("button");
      check.className = "primary";
      check.textContent = "Check for Updates";
      check.title = "Look for new chapters on every favorited title";
      check.addEventListener("click", () => checkFavoriteUpdates(check));
      tools.appendChild(check);
      els.libraryContent.appendChild(tools);

      if (!state.favorites.length) {
        els.libraryContent.appendChild(renderEmpty("No favorites yet. Open a title and press Save to track new chapters here."));
        return;
      }
      for (const manga of state.favorites) {
        const row = document.createElement("div");
        row.className = "library-row favorite-row";
        const info = document.createElement("div");
        info.className = "library-info";
        const title = document.createElement("strong");
        title.textContent = manga.title;
        if (manga.newCount > 0) {
          const badgeEl = document.createElement("span");
          badgeEl.className = "new-badge";
          badgeEl.textContent = `+${manga.newCount} NEW`;
          title.appendChild(badgeEl);
        }
        const source = document.createElement("span");
        source.textContent = `${manga.sourceName || manga.source}${manga.chapterCount ? ` · ${manga.chapterCount} chapters` : ""}${manga.latestLabel ? ` · latest CH. ${manga.latestLabel}` : ""}`;
        info.append(title, source);
        const actions = document.createElement("div");
        actions.className = "library-actions";
        const open = document.createElement("button");
        open.className = "primary";
        open.textContent = "Open";
        open.addEventListener("click", () => loadManga(manga));
        const remove = document.createElement("button");
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
          const index = state.favorites.findIndex((item) => favoriteKey(item) === favoriteKey(manga));
          state.favorites = state.favorites.filter((item) => favoriteKey(item) !== favoriteKey(manga));
          localStorage.setItem("mangaflow:favorites", JSON.stringify(state.favorites));
          renderLibrary();
          toast("Removed from favorites", "", { label: "Undo", onClick: () => {
            state.favorites.splice(Math.max(0, Math.min(index, state.favorites.length)), 0, manga);
            localStorage.setItem("mangaflow:favorites", JSON.stringify(state.favorites));

            if (state.view === "details") renderManga();
          } });
        });

        row.append(info, actions);
        els.libraryContent.appendChild(row);
      }
    }

    function renderHistoryTab() {
      const entries = Object.entries(state.history)
        .filter(([, entry]) => entry.manga && entry.chapter && entry.updatedAt)
        .sort(([, a], [, b]) => b.updatedAt - a.updatedAt);
      if (!entries.length) {
        els.libraryContent.appendChild(renderEmpty("Chapters you read will appear here."));
        return;
      }
      const tools = document.createElement("div");
      tools.className = "library-actions";
      const clear = document.createElement("button");
      clear.textContent = "Clear History";
      clear.addEventListener("click", async () => {
        const ok = await confirmDialog({
          title: "Clear reading history?",
          body: "This removes all reading progress and read markers on this device. Favorites and downloads are kept.",
          confirmLabel: "Clear History",
          danger: true
        });
        if (!ok) return;
        state.history = {};
        saveHistory();
        renderLibrary();
        renderShelf();
      });
      tools.appendChild(clear);
      els.libraryContent.appendChild(tools);

      for (const [key, entry] of entries) {
        const row = document.createElement("div");
        row.className = "library-row favorite-row";
        const info = document.createElement("div");
        info.className = "library-info";
        const title = document.createElement("strong");

        const detail = document.createElement("span");
        const when = new Date(entry.updatedAt).toLocaleDateString();
        detail.textContent = `CH. ${entry.chapter.label || "?"} · page ${entry.page || 1}${entry.pages ? `/${entry.pages}` : ""} · ${when}${entry.read?.length ? ` · ${entry.read.length} read` : ""}`;
        info.append(title, detail);
        const actions = document.createElement("div");
        actions.className = "library-actions";
        const resume = document.createElement("button");
        resume.className = "primary";
        resume.textContent = "Resume";
        resume.addEventListener("click", () => resumeHistory(entry));
        const remove = document.createElement("button");
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
          delete state.history[key];
          saveHistory();
          renderLibrary();
          renderShelf();
          toast("Removed from history", "", { label: "Undo", onClick: () => {
            state.history[key] = entry;
            saveHistory();
            if (state.view === "library") renderLibrary();
            renderShelf();
          } });
        });
        actions.append(resume, remove);
        row.append(info, actions);

    function renderSourcesTab() {
      if (!state.allSources.length) {
        els.libraryContent.appendChild(renderEmpty("Source list is still loading or unavailable. Try Refresh."));
        return;
      }
      const hint = document.createElement("div");
      hint.className = "sources-hint";
      hint.textContent = "Choose which sites MangaFlow searches. Some sites go offline or block requests over time — if searches come up empty, try enabling other sources. Defaults are the sites verified to work recently.";
      const toolbar = document.createElement("div");
      toolbar.className = "sources-toolbar";
      const filter = document.createElement("input");
      filter.className = "filter";
      filter.placeholder = "FILTER SOURCES...";
      filter.value = state.sourcesFilter;
      const defaults = document.createElement("button");
      defaults.type = "button";
      defaults.textContent = "Restore Defaults";
      defaults.addEventListener("click", () => {
        state.enabledSources = [...state.sourceDefaults];
        saveEnabledSources();
        renderLibrary();
        toast("Default sources restored");
      });
      const enabledCount = document.createElement("span");
      enabledCount.className = "library-state";
      enabledCount.textContent = `${state.enabledSources.length}/${state.allSources.length} enabled`;
      toolbar.append(filter, defaults, enabledCount);
      els.libraryContent.append(hint, toolbar);

      const listWrap = document.createElement("div");
      const needle = state.sourcesFilter.trim().toLowerCase();
      const visible = state.allSources.filter((source) => !needle || source.name.toLowerCase().includes(needle));
      for (const source of visible) {
        const row = document.createElement("div");
        row.className = "source-row";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = `src-${source.id}`;
        checkbox.checked = state.enabledSources.includes(source.id);
        const label = document.createElement("label");
        label.htmlFor = checkbox.id;
        const name = document.createElement("strong");
        name.textContent = source.name;
        label.appendChild(name);
        if (state.sourceDefaults.includes(source.id)) label.appendChild(badge("default"));
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) {
            if (!state.enabledSources.includes(source.id)) state.enabledSources.push(source.id);
          } else {
            state.enabledSources = state.enabledSources.filter((id) => id !== source.id);
          }
          saveEnabledSources();
          enabledCount.textContent = `${state.enabledSources.length}/${state.allSources.length} enabled`;
        });
        row.append(checkbox, label);
        listWrap.appendChild(row);
      }
      filter.addEventListener("input", () => {
        state.sourcesFilter = filter.value;
        const caret = filter.selectionStart;
        renderLibrary();
        const fresh = els.libraryContent.querySelector(".sources-toolbar .filter");
        if (fresh) {
          fresh.focus();
          fresh.setSelectionRange(caret, caret);
        }
      });
      els.libraryContent.appendChild(listWrap);
    }

    async function checkFavoriteUpdates(button) {
      if (!state.favorites.length) {
        toast("No favorites to check yet.");
        return;
      }
      button.disabled = true;
      let newChapters = 0;
      let checked = 0;
      let failed = 0;
      for (const favorite of state.favorites) {
        button.textContent = `Checking ${checked + 1}/${state.favorites.length}...`;
        try {
          const data = await getJSON(`/api/manga?source=${encodeURIComponent(favorite.source)}&id=${encodeURIComponent(favorite.id)}&refresh=1`);
          const count = (data.chapters || []).length;
          if (favorite.chapterCount === undefined || favorite.chapterCount === null) {
            favorite.chapterCount = count;
          } else if (count > favorite.chapterCount) {
            favorite.newCount = (favorite.newCount || 0) + (count - favorite.chapterCount);
            newChapters += count - favorite.chapterCount;
            favorite.chapterCount = count;
          }
          favorite.latestLabel = count ? data.chapters[count - 1].label : favorite.latestLabel;
          favorite.checkedAt = Date.now();
          checked += 1;
        } catch {
          failed += 1;
        }
      }
      localStorage.setItem("mangaflow:favorites", JSON.stringify(state.favorites));
      button.disabled = false;
      button.textContent = "Check for Updates";
      renderLibrary();
      toast(newChapters ? `${newChapters} new chapters found across ${checked} titles` : `No new chapters · ${checked} checked${failed ? ` · ${failed} failed` : ""}`);
    }

    async function retryDownload(job) {
      const chapter = { source: job.source, id: job.chapterId, label: job.label, title: job.title };
      try {
        const response = await fetch("/api/downloads", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source: job.source, id: job.chapterId, label: job.label, title: job.title,
            mangaTitle: job.mangaTitle || "", mangaId: job.mangaId || "", mangaSource: job.mangaSource || ""
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || "Could not restart download.");
        refreshLibrary();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    async function cancelDownload(jobId) {
      try {
        const response = await fetch(`/api/downloads/${encodeURIComponent(jobId)}/cancel`, { method: "POST" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || "Could not cancel download.");
        refreshLibrary();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    async function removeDownload(jobId) {
      const job = state.downloads.find((item) => item.id === jobId);
      const ok = await confirmDialog({
        title: "Remove offline chapter?",
        body: `This deletes the saved pages${job ? ` for CH. ${job.label}` : ""} from this device. You can download it again later.`,
        confirmLabel: "Remove",
        danger: true
      });
      if (!ok) return;
      try {
        const response = await fetch(`/api/downloads/${encodeURIComponent(jobId)}`, { method: "DELETE" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || "Could not remove download.");
        if (state.lastRead?.chapter?.offlineId === jobId) {
          state.lastRead = null;
          localStorage.removeItem("mangaflow:lastRead");
          updateContinue();
        }
        refreshLibrary();
      } catch (err) {
        setStatus(err.message, "error");
        toast(err.message, "error");
      }
    }

    async function openOfflineChapter(jobId, options = {}) {
      try {
        const job = await getJSON(`/api/library/${encodeURIComponent(jobId)}`);
        const data = await getJSON("/api/downloads").catch(() => ({ downloads: [] }));
        const all = data.downloads || [];
        state.downloads = all;
        const sameManga = all.filter((item) => item.status === "completed" && (
          (job.mangaId && item.mangaId === job.mangaId && item.mangaSource === job.mangaSource) ||
          (!job.mangaId && job.mangaTitle && item.mangaTitle === job.mangaTitle)
        ));
        sameManga.sort((a, b) => (parseFloat(a.label) || 0) - (parseFloat(b.label) || 0));
        state.offlineQueue = sameManga.length ? sameManga : [job];
        state.offlineIndex = Math.max(0, state.offlineQueue.findIndex((item) => item.id === jobId));
        state.offlineReader = true;
        state.chapterIndex = -1;
        state.manga = { title: job.mangaTitle || "Offline chapter", id: job.mangaId, source: job.mangaSource };
        const savedPage = options.page > 0
          ? options.page
          : state.lastRead?.chapter?.offlineId === jobId
            ? state.lastRead.chapter.page
            : state.lastRead?.chapter?.source === job.source && state.lastRead?.chapter?.id === job.chapterId
              ? state.lastRead.chapter.page
              : 1;
        state.lastRead = {
          manga: { id: job.mangaId, source: job.mangaSource, title: job.mangaTitle || "Offline chapter" },
          chapter: { id: job.chapterId, source: job.source, label: job.label, page: Number(savedPage || 1), pages: job.pageCount, offlineId: job.id }
        };
        localStorage.setItem("mangaflow:lastRead", JSON.stringify(state.lastRead));
        recordProgress(Number(savedPage || 1));
        show("reader");
        renderReader({ label: job.label, number: parseFloat(job.label) || 0 }, job.pages, state.lastRead.chapter.page);
        if (!options.fromRoute) setHash(`#/offline/${encodeURIComponent(jobId)}`);
      } catch (err) {
        setStatus(err.message, "error");
        toast(err.message, "error");
      }
    }

    function exportData() {
      const payload = {
        app: "MangaFlow",
        version: 1,
        exportedAt: new Date().toISOString(),
        favorites: state.favorites,
        history: state.history,
        settings: state.settings,
        lastRead: state.lastRead,
        recent: state.recent
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `mangaflow-backup-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
      toast("Library data exported");
    }

    async function importData() {
      const file = els.importFile.files?.[0];
      els.importFile.value = "";
      if (!file) return;
      try {
        const payload = JSON.parse(await file.text());
        if (!payload || payload.app !== "MangaFlow") throw new Error("Not a MangaFlow backup file.");
        if (Array.isArray(payload.favorites)) {
          state.favorites = payload.favorites;
          localStorage.setItem("mangaflow:favorites", JSON.stringify(state.favorites));
        }
        if (payload.history && typeof payload.history === "object") {
          state.history = payload.history;
          saveHistory();
        }
        if (payload.settings && typeof payload.settings === "object") {
          state.settings = { ...DEFAULT_SETTINGS, ...payload.settings };
          saveSettings();
        }
        if (payload.lastRead && typeof payload.lastRead === "object") {
          state.lastRead = payload.lastRead;
          localStorage.setItem("mangaflow:lastRead", JSON.stringify(state.lastRead));
        }
        if (Array.isArray(payload.recent)) {
          state.recent = payload.recent;
          localStorage.setItem("mangaflow:recent", JSON.stringify(state.recent));
          renderRecent();
        }
        updateContinue();
        renderLibrary();
        renderShelf();
        toast("Backup imported");
      } catch (err) {
        toast(`Import failed: ${err.message}`, "error");
      }
    }

    function isPagedMode() {
      return state.settings.readerMode === "single" || state.settings.readerMode === "double";
    }

    function pageStep() {
      return state.settings.readerMode === "double" ? 2 : 1;
    }

    function hasChapterStep(delta) {
      if (state.offlineReader) {
        const target = state.offlineIndex + delta;
        return target >= 0 && target < state.offlineQueue.length;
      }
      const target = state.chapterIndex + delta;
      return target >= 0 && target < state.chapters.length;
    }

    function chapterStep(delta) {
      if (state.loading) return;
      if (delta > 0 && state.readerChapter) markChapterRead(state.readerChapter.label);
      if (state.offlineReader) {
        if (hasChapterStep(delta)) openOfflineChapter(state.offlineQueue[state.offlineIndex + delta].id);
        return;
      }
      if (hasChapterStep(delta)) loadChapter(state.chapterIndex + delta);
    }

    function goBackFromReader() {
      if (state.offlineReader) navigate("#/library/downloads");
      else if (state.manga && state.manga.id && state.manga.source) navigate(titleHash(state.manga));
      else navigate("#/");
    }
